[package]
name = "tdb-succinct-wasm"
version = "0.1.2"
authors = [
    "Matthijs van Otterdijk <matthijs@terminusdb.com>",
    "Gavin Mendel-Gleason <gavin@terminusdb.com>"
]
edition = "2021"
license = "Apache-2.0"
description = "succinct data structures used by terminusdb"
homepage = "https://terminusdb.com"
repository = "https://github.com/terminusdb-labs/tdb-succinct"
documentation = "https://docs.rs/tdb-succinct/"
exclude = [".gitignore", ".github/", "/ci/"]

[dependencies]
base64 = "0.22.1"
bitvec = "1.0.1"
byteorder = "1.5.0"
bytes = "1.11.1"
chrono = "0.4.44"
hex = "0.4.3"
itertools = "0.14.0"
num-bigint = "0.4.6"
num-derive = "0.4.2"
num-rational = "0.4.2"
num-traits = "0.2.19"
regex = "1.12.3"
thiserror = "2.0.18"

[dev-dependencies]
proptest = "1.10.0"
